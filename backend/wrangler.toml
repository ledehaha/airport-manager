# ==========================================
# 机场节点管理系统 - 后端配置
# ==========================================

name = "airport-manager-api"
compatibility_date = "2024-04-05"
compatibility_flags = [ "nodejs_compat" ]
main = "src/index.ts"

# ==========================================
# D1 数据库配置
# ==========================================
# 首次部署前需要：
# 1. 执行: wrangler d1 create airport_db
# 2. 把输出的 database_id 填到下面
# 3. 执行: wrangler d1 execute airport_db --file=./schema.sql
# ==========================================

# [[d1_databases]]
# binding = "DB"
# database_name = "airport_db"
# database_id = "填入你的数据库ID"

# ==========================================
# 环境变量配置
# ==========================================

# [vars]
# JWT_SECRET = "设置一个复杂的随机字符串，用于JWT签名"

# ==========================================
# 开发配置（可选）
# ==========================================

[dev]
port = 8787
local_protocol = "http"
